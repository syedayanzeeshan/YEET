[package]
name = "yeet_protocol_demo"
version = "0.1.0"
description = "YEET correctness market — permissionless task settlement on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "yeet_protocol_demo"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
